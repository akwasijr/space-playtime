<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Space</title>
<link rel="stylesheet" href="styles.css?v=39" />
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
  <canvas id="confetti" class="confetti" aria-hidden="true"></canvas>
  <canvas id="scene"></canvas>

  <!-- Mission cards intro (auto-removes after the animation) -->
  <div id="mission-intro" class="mission-intro" aria-hidden="true">
    <div class="mission-stage">
      <div class="mission-cards">
        <div class="mission-card mc-1" data-action="planet">
          <div class="mc-art">
            <svg viewBox="0 0 120 120" width="120" height="120" aria-hidden="true">
              <defs>
                <radialGradient id="planet-fill" cx="38%" cy="35%" r="70%">
                  <stop offset="0%" stop-color="#ffd28a"/>
                  <stop offset="55%" stop-color="#e07a3a"/>
                  <stop offset="100%" stop-color="#3a0f06"/>
                </radialGradient>
              </defs>
              <ellipse cx="60" cy="62" rx="52" ry="9" fill="none" stroke="#d8b88a" stroke-width="2.4" opacity="0.9"/>
              <ellipse cx="60" cy="62" rx="52" ry="9" fill="none" stroke="#5a4828" stroke-width="0.8" opacity="0.9"/>
              <circle cx="60" cy="60" r="34" fill="url(#planet-fill)"/>
              <ellipse cx="60" cy="62" rx="52" ry="9" fill="none" stroke="#d8b88a" stroke-width="2.4" opacity="0.9" clip-path="inset(50% 0 0 0)"/>
            </svg>
          </div>
          <div class="mc-text">Visit every planet</div>
        </div>

        <div class="mission-card mc-2" data-action="moon">
          <div class="mc-art">
            <svg viewBox="0 0 120 120" width="120" height="120" aria-hidden="true">
              <defs>
                <radialGradient id="moon-fill" cx="35%" cy="32%" r="72%">
                  <stop offset="0%" stop-color="#f4f1e8"/>
                  <stop offset="55%" stop-color="#bbb4a3"/>
                  <stop offset="100%" stop-color="#1d1a14"/>
                </radialGradient>
              </defs>
              <circle cx="60" cy="60" r="38" fill="url(#moon-fill)"/>
              <circle cx="48" cy="50" r="5"  fill="#7d7666" opacity="0.55"/>
              <circle cx="70" cy="58" r="3.5" fill="#6f6857" opacity="0.55"/>
              <circle cx="55" cy="74" r="4"  fill="#6f6857" opacity="0.55"/>
              <circle cx="76" cy="72" r="2.5" fill="#5a5345" opacity="0.55"/>
              <circle cx="42" cy="66" r="2"  fill="#5a5345" opacity="0.55"/>
            </svg>
          </div>
          <div class="mc-text">Find a moon</div>
        </div>

        <div class="mission-card mc-3" data-action="blackhole">
          <div class="mc-art">
            <svg viewBox="0 0 120 120" width="120" height="120" aria-hidden="true">
              <defs>
                <radialGradient id="disc-fill" cx="50%" cy="50%" r="55%">
                  <stop offset="40%" stop-color="rgba(0,0,0,0)"/>
                  <stop offset="55%" stop-color="#ffe4a8"/>
                  <stop offset="72%" stop-color="#ff7a2a"/>
                  <stop offset="100%" stop-color="rgba(60,15,0,0)"/>
                </radialGradient>
              </defs>
              <ellipse cx="60" cy="62" rx="50" ry="14" fill="url(#disc-fill)"/>
              <circle cx="60" cy="60" r="22" fill="#000"/>
              <circle cx="60" cy="60" r="24" fill="none" stroke="#ffd9a0" stroke-width="1.4" opacity="0.85"/>
              <ellipse cx="60" cy="62" rx="50" ry="14" fill="url(#disc-fill)" clip-path="inset(50% 0 0 0)"/>
            </svg>
          </div>
          <div class="mc-text">Don't fall in the black hole</div>
        </div>

        <div class="mission-card mc-4" data-action="quiz">
          <div class="mc-art">
            <svg viewBox="0 0 120 120" width="120" height="120" aria-hidden="true">
              <defs>
                <radialGradient id="quiz-fill" cx="35%" cy="32%" r="72%">
                  <stop offset="0%" stop-color="#ffe8a8"/>
                  <stop offset="55%" stop-color="#f0a830"/>
                  <stop offset="100%" stop-color="#3a1f00"/>
                </radialGradient>
              </defs>
              <circle cx="60" cy="60" r="40" fill="url(#quiz-fill)"/>
              <text x="60" y="78" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="56" font-weight="700" fill="#1a0f00">?</text>
            </svg>
          </div>
          <div class="mc-text">Take a space quiz</div>
        </div>
      </div>
      <p class="mission-hint" hidden></p>
      <button id="mission-go" class="mission-go" type="button">
        <span>Let's explore!</span>
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
          <path d="M3 8 L 13 8 M 9 4 L 13 8 L 9 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
    <span class="sparkle s1"></span>
    <span class="sparkle s2"></span>
    <span class="sparkle s3"></span>
    <span class="sparkle s4"></span>
    <span class="sparkle s5"></span>
    <span class="sparkle s6"></span>
  </div>

  <div id="hover-label" aria-hidden="true"></div>

  <div id="caption" class="caption" aria-live="polite"></div>

  <button id="back" class="back" type="button" hidden>← back</button>

  <!-- Interactive hotspots around the focused body -->
  <div id="hotspots" class="hotspots" hidden aria-hidden="true">
    <button class="hot hot-about" type="button" data-section="about" aria-label="About">
      <span class="hot-icon"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M2.5 3 H 7 a1.5 1.5 0 0 1 1.5 1.5 V 13 a1 1 0 0 0-1-1 H 2.5 Z M 13.5 3 H 9 A 1.5 1.5 0 0 0 7.5 4.5 V 13 a 1 1 0 0 1 1-1 H 13.5 Z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg></span><span class="hot-label">About</span>
    </button>
    <button class="hot hot-facts" type="button" data-section="facts" aria-label="Wow facts">
      <span class="hot-icon"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M8 1.5 L9.4 5.6 L13.7 5.9 L10.4 8.7 L11.5 13 L8 10.7 L4.5 13 L5.6 8.7 L2.3 5.9 L6.6 5.6 Z" fill="currentColor"/></svg></span><span class="hot-label">Wow facts</span>
    </button>
    <button class="hot hot-stats" type="button" data-section="stats" aria-label="By the numbers">
      <span class="hot-icon"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><rect x="2" y="9" width="2.6" height="5" fill="currentColor"/><rect x="6.7" y="6" width="2.6" height="8" fill="currentColor"/><rect x="11.4" y="3" width="2.6" height="11" fill="currentColor"/></svg></span><span class="hot-label">Numbers</span>
    </button>
    <button class="hot hot-inside" type="button" data-section="inside" aria-label="Inside the body">
      <span class="hot-icon"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.3"/><circle cx="8" cy="8" r="3.8" fill="none" stroke="currentColor" stroke-width="1.3"/><circle cx="8" cy="8" r="1.4" fill="currentColor"/></svg></span><span class="hot-label">Inside</span>
    </button>
  </div>

  <!-- Floating section popup -->
  <div id="section-pop" class="section-pop" hidden>
    <button id="section-pop-close" class="section-pop-close" type="button" aria-label="Close">×</button>
    <h3 id="section-pop-title"></h3>
    <div id="section-pop-body"></div>
  </div>

  <div id="hint" class="hint">drag to look · scroll to zoom · right-drag (or shift+drag) to pan · click anything</div>

  <div class="top-bar">
    <div class="search">
      <button id="search-toggle" class="top-btn primary" type="button" aria-label="Find an object" aria-expanded="false">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
          <circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.7"/>
          <path d="M10.5 10.5 L 14 14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
        <span>Find</span>
      </button>
      <div id="search-panel" class="search-panel" hidden>
        <div class="search-head">
          <input id="search-input" type="text" placeholder="search…" autocomplete="off" spellcheck="false" />
          <button id="search-close" type="button" aria-label="Close">×</button>
        </div>
        <div id="search-results" class="search-results" role="listbox"></div>
      </div>
    </div>
    <button id="home-btn" class="top-btn" type="button" aria-label="Go home">
      <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
        <path d="M2.5 8 L 8 3 L 13.5 8 L 13.5 13 L 10 13 L 10 9.5 L 6 9.5 L 6 13 L 2.5 13 Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      </svg>
      <span>Home</span>
    </button>
    <button id="galaxy-btn" class="top-btn" type="button" aria-label="Galaxy view">
      <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
        <ellipse cx="8" cy="8" rx="6.4" ry="2.2" fill="none" stroke="currentColor" stroke-width="1.4" transform="rotate(-22 8 8)"/>
        <circle cx="8" cy="8" r="1.2" fill="currentColor"/>
      </svg>
      <span>Galaxy</span>
    </button>
    <button id="iss-btn" class="top-btn" type="button" aria-label="Astronaut view from the ISS">
      <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
        <rect x="6.4" y="6.4" width="3.2" height="3.2" rx="0.4" fill="none" stroke="currentColor" stroke-width="1.3"/>
        <rect x="1.5" y="7.1" width="4.2" height="1.8" fill="none" stroke="currentColor" stroke-width="1.2"/>
        <rect x="10.3" y="7.1" width="4.2" height="1.8" fill="none" stroke="currentColor" stroke-width="1.2"/>
        <path d="M5.7 8 L 6.4 8 M 9.6 8 L 10.3 8" stroke="currentColor" stroke-width="1.2"/>
      </svg>
      <span>ISS</span>
    </button>
  </div>

  <div id="iss-hud" class="iss-hud" hidden>
    <div class="iss-hud-card">
      <div class="iss-hud-label">Speed</div>
      <div class="iss-hud-row"><span class="iss-hud-val" id="iss-speed">27,600</span><span class="iss-hud-unit">km/h</span></div>
    </div>
    <div class="iss-hud-card">
      <div class="iss-hud-label">Altitude</div>
      <div class="iss-hud-row"><span class="iss-hud-val" id="iss-alt">408</span><span class="iss-hud-unit">km</span></div>
    </div>
    <div class="iss-hud-card">
      <div class="iss-hud-label">Sunrises today</div>
      <div class="iss-hud-row"><span class="iss-hud-val" id="iss-sunrises">0</span><span class="iss-hud-unit">of 16</span></div>
    </div>
  </div>

  <div id="iss-astronaut" class="iss-astronaut" hidden aria-hidden="true">
    <svg viewBox="0 0 100 140" width="86" height="120">
      <ellipse cx="50" cy="138" rx="22" ry="3" fill="rgba(0,0,0,0.25)"/>
      <circle cx="50" cy="36" r="22" fill="#f4f4f8"/>
      <ellipse cx="50" cy="34" rx="14" ry="12" fill="#1a1a2e"/>
      <ellipse cx="46" cy="30" rx="6" ry="5" fill="#7adfff"/>
      <ellipse cx="44" cy="28" rx="2" ry="1.5" fill="#ffffff" opacity="0.85"/>
      <path d="M30 56 Q 30 50 36 50 L 64 50 Q 70 50 70 56 L 70 100 Q 70 108 62 108 L 38 108 Q 30 108 30 100 Z" fill="#f4f4f8"/>
      <rect x="42" y="62" width="16" height="12" rx="2" fill="#c8d4e8"/>
      <rect x="42" y="62" width="16" height="2" fill="#d94848"/>
      <circle cx="46" cy="70" r="1.2" fill="#2e7a4d"/>
      <circle cx="54" cy="70" r="1.2" fill="#ffc04d"/>
      <path d="M30 58 Q 18 40 14 18 L 20 14 Q 26 38 38 56 Z" fill="#f4f4f8" class="iss-arm-wave"/>
      <circle cx="14" cy="16" r="4.5" fill="#f4f4f8"/>
      <path d="M70 58 Q 78 70 80 90 L 76 92 Q 72 76 64 64 Z" fill="#f4f4f8"/>
      <rect x="34" y="100" width="12" height="32" rx="4" fill="#f4f4f8"/>
      <rect x="54" y="100" width="12" height="32" rx="4" fill="#f4f4f8"/>
      <rect x="32" y="128" width="16" height="8" rx="2" fill="#1a1a2e"/>
      <rect x="52" y="128" width="16" height="8" rx="2" fill="#1a1a2e"/>
    </svg>
  </div>

  <div id="iss-fact" class="iss-fact" hidden>
    <span class="iss-fact-tag">Did you know?</span>
    <span class="iss-fact-text" id="iss-fact-text"></span>
  </div>

  <button id="iss-photo" class="iss-photo" type="button" hidden aria-label="Take a photo">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
      <path d="M5 8 L 8.5 8 L 10 6 L 14 6 L 15.5 8 L 19 8 Q 21 8 21 10 L 21 17 Q 21 19 19 19 L 5 19 Q 3 19 3 17 L 3 10 Q 3 8 5 8 Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      <circle cx="12" cy="13.5" r="4" fill="none" stroke="currentColor" stroke-width="1.6"/>
    </svg>
    <span>Photo</span>
  </button>

  <div id="iss-flash" class="iss-flash" hidden></div>
  <div id="iss-toast" class="iss-toast" hidden>Photo saved!</div>

  <button id="iss-exit" class="iss-exit" type="button" hidden>
    <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
      <path d="M10 3 L 5 8 L 10 13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span>Back to space</span>
  </button>

  <div id="tour-bar" class="tour-bar" hidden aria-live="polite">
    <button id="tour-prev" class="tour-step-btn" type="button" aria-label="Previous planet">
      <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
        <path d="M10 3 L 5 8 L 10 13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <button id="tour-next" class="tour-step-btn" type="button" aria-label="Next planet">
      <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
        <path d="M6 3 L 11 8 L 6 13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <button id="tour-exit" class="tour-exit" type="button" aria-label="End tour">×</button>
  </div>

  <button id="info-toggle" class="info-toggle" type="button" aria-label="More about this object" hidden>i</button>

  <button id="galaxy-learn" class="galaxy-learn" type="button" hidden>
    <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
      <circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.4"/>
      <circle cx="8" cy="5" r="0.9" fill="currentColor"/>
      <path d="M7.2 7.4 L 7.2 11.6 L 8.8 11.6 L 8.8 7.4 Z" fill="currentColor"/>
    </svg>
    <span>About the Milky Way</span>
  </button>

  <!-- Quiz overlay -->
  <div id="quiz-overlay" class="quiz-overlay" hidden>
    <div class="quiz-card" role="dialog" aria-modal="true" aria-labelledby="quiz-title">
      <header class="quiz-head">
        <h3 id="quiz-title">Quiz</h3>
        <button id="quiz-close" type="button" aria-label="Close quiz">×</button>
      </header>
      <div class="quiz-progress"><div id="quiz-progress-fill"></div></div>
      <div id="quiz-body"></div>
    </div>
  </div>

  <button id="launch-btn" class="launch-btn" type="button" hidden>
    <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
      <path d="M8 1.5 C 5.5 4 4.5 6.5 4.5 9 L 4.5 11 L 6 11 L 6 12.5 L 4 14 L 5 14.5 L 6 13.8 L 6.6 14.5 L 8 13.5 L 9.4 14.5 L 10 13.8 L 11 14.5 L 12 14 L 10 12.5 L 10 11 L 11.5 11 L 11.5 9 C 11.5 6.5 10.5 4 8 1.5 Z M 8 6.2 a 1.1 1.1 0 1 0 0 2.2 a 1.1 1.1 0 1 0 0 -2.2 Z" fill="currentColor"/>
    </svg>
    Launch rocket
  </button>

  <aside id="info-panel" class="info-panel" hidden aria-labelledby="info-title">
    <div class="info-header">
      <h2 id="info-title"></h2>
      <button id="info-close" class="info-close" type="button" aria-label="Close">×</button>
    </div>
    <div class="info-panel-inner">
      <div id="info-body"></div>
    </div>
  </aside>

  <div class="zoom-controls" aria-label="View controls">
    <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
    <button id="zoom-out" type="button" aria-label="Zoom out">−</button>
    <button id="recenter" type="button" aria-label="Recenter on the Sun">⌖</button>
  </div>

  <div id="minimap" class="minimap" aria-label="Solar system map">
    <svg id="minimap-svg" viewBox="-110 -110 220 220" xmlns="http://www.w3.org/2000/svg">
      <g id="minimap-orbits"></g>
      <g id="minimap-dots"></g>
    </svg>
  </div>

  <script type="module" src="app.js?v=39"></script>
</body>
</html>
